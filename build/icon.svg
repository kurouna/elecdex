<?xml version="1.0" encoding="UTF-8"?>
<!--
  elecdex app icon - the master for every icon size (see scripts/gen-icon.mjs).

  Follows the elec series layout shared with elecxzy, elecxterm and elecxmail:
  the app's own motif on a card, with the series "E" badge overlapping the
  bottom-left corner (a #0ea5e9 disc with a white rim and three rounded bars).

  elecdex's motif is its workspace of many panes: a light card divided by wide
  gutters into five dark HUD panes - system bars, a wireframe globe with a
  connection, a live CPU trace, a process list, and a shell pane behind the badge -
  so it reads as panes side by side even at taskbar size, and not as the single
  dark terminal of elecxterm.
-->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>elecdex</title>
  <!-- Card, with the series' offset shadow for depth; light, so the gutters show -->
  <rect x="44" y="24" width="184" height="216" rx="16" fill="#94a3b8"/>
  <rect x="40" y="20" width="184" height="216" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Panes: dark, with a teal title rule, 10px apart -->
  <g fill="#0b1118" stroke="#aacfd1" stroke-width="2">
    <rect x="52" y="32" width="66" height="62" rx="6"/>
    <rect x="128" y="32" width="84" height="62" rx="6"/>
    <rect x="128" y="104" width="84" height="56" rx="6"/>
    <rect x="128" y="170" width="84" height="54" rx="6"/>
    <rect x="52" y="104" width="66" height="120" rx="6"/>
  </g>
  <g fill="#aacfd1">
    <rect x="58" y="38" width="18" height="3" rx="1.5"/>
    <rect x="134" y="38" width="16" height="3" rx="1.5"/>
    <rect x="134" y="110" width="20" height="3" rx="1.5"/>
    <rect x="134" y="176" width="14" height="3" rx="1.5"/>
    <rect x="58" y="110" width="22" height="3" rx="1.5"/>
  </g>

  <!-- System: usage bars -->
  <g fill="#22d3ee">
    <rect x="58" y="52" width="40" height="6" rx="3"/>
    <rect x="58" y="66" width="28" height="6" rx="3" fill-opacity="0.7"/>
    <rect x="58" y="80" width="48" height="6" rx="3" fill-opacity="0.45"/>
  </g>

  <!-- World: wireframe globe with a connection -->
  <g stroke="#aacfd1" stroke-width="2">
    <circle cx="170" cy="68" r="20"/>
    <ellipse cx="170" cy="68" rx="8" ry="20" stroke-opacity="0.7"/>
    <path d="M150 68 H190" stroke-opacity="0.7"/>
  </g>
  <path d="M160 58 Q174 44 182 74" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="160" cy="58" r="3" fill="#22d3ee"/>
  <circle cx="182" cy="74" r="3" fill="#22d3ee"/>

  <!-- CPU: a live trace -->
  <path d="M136 148 L148 140 L158 150 L170 122 L182 142 L192 132 L204 144" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Processes: a list -->
  <g fill="#aacfd1">
    <rect x="136" y="188" width="44" height="5" rx="2.5" fill-opacity="0.8"/>
    <rect x="136" y="200" width="60" height="5" rx="2.5" fill-opacity="0.55"/>
    <rect x="136" y="212" width="34" height="5" rx="2.5" fill-opacity="0.35"/>
  </g>

  <!-- elec series badge: the "E" mark, bottom-left -->
  <circle cx="68" cy="180" r="52" fill="#0ea5e9" stroke="#ffffff" stroke-width="8"/>
  <path d="M44 156 H92 M44 180 H76 M44 204 H92" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
