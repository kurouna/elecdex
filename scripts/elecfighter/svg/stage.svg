<svg xmlns="http://www.w3.org/2000/svg" width="512" height="288" viewBox="0 0 512 288" shape-rendering="crispEdges">
  <title>ELECFIGHTER stage GRID: 512 x 288, BG0's map, drawn for the camera in the middle (camX 96).</title>
  <!--
    The map as the camera in the middle of its reach sees it: map x 256 is the world's middle.
    Each part moves at its own share of the camera's move (scripts/elecfighter/stage.mjs):
      rows 0-19 (y 0-159)   the far skyline, 0.25
      row 20 (y 160-167)    the platform's far rim, 0.5
      y 168-287             the floor, a line at a time: s(y) = (y - 54) / 190, 0.6 at the
                            horizon (168), 1.0 on the foot line (244), 1.23 at the bottom
    A floor point at world X is at map x 256 + (X - 256) * s(y), on a straight line through
    (256, 54). Only what a camera from 0 to 192 can show is drawn: the far parts in map x 72-440
    and 48-464, the floor's lines inside what each line shows.
  -->
  <rect x="0" y="0" width="512" height="288" fill="#000810"/>
  <!-- far: low stepped mesas, outline only -->
  <g id="mesas" fill="none" stroke="#103040">
    <polyline points="72.5,152.5 88.5,136.5 120.5,136.5 136.5,152.5 176.5,152.5 184.5,144.5 216.5,144.5 224.5,152.5 256.5,152.5 288.5,152.5 296.5,144.5 328.5,144.5 336.5,152.5 376.5,152.5 392.5,136.5 424.5,136.5 440.5,152.5"/>
  </g>
  <!-- far: the skyline, flat-topped blocks on the 8-point grid, floors every 8 rows, mirrored about x 256 -->
  <g id="skyline">
