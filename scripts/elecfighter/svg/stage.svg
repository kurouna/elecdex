  <!-- middle: the platform's far rim -->
  <g id="rim"><rect x="128" y="165" width="256" height="1" fill="#184858"/></g>
  <!-- the floor: its far edge on the horizon, the cut corners, the sides at world X 0 and 512 down to the foot line, rows by depth, lines every 80 world points from 24 rows below the horizon -->
  <g id="floor">
  <rect x="141" y="168" width="230" height="1" fill="#78d8e0"/>
  <line x1="140.8" y1="168.5" x2="59.28" y2="200.5" stroke="#78d8e0"/>
  <line x1="371.2" y1="168.5" x2="452.72" y2="200.5" stroke="#78d8e0"/>
