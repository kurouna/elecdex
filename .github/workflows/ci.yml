name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, a run can be narrowed to what is being looked into: some e2e specs on some systems,
  # nothing else (the lint, unit and package jobs then skip). Left empty, it is the whole run.
  workflow_dispatch:
    inputs:
      e2e_specs:
        description: 'e2e only: Playwright arguments, e.g. tests/e2e/contracts/no-external.spec.ts --project=e2e'
        required: false
        default: ''
      e2e_os:
        description: 'e2e only: the systems, as JSON'
        required: false
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'

# Nothing here writes to the repository (found in a security review): the token only reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  static:
    name: lint & typecheck
    if: ${{ !inputs.e2e_specs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: unit & component
    if: ${{ !inputs.e2e_specs }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The shells elecdex integrates with, so shell-cwd-scripts.test.ts runs each
      # one's own script (bash is already there).
      - name: zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: npm test

  # Each system's suite is run in parts, each on a runner of its own: five shares of the e2e
  # project and the perf project apart. One app per machine, as on a desk - running specs side by
  # side on one machine made the load-sensitive ones fail (docs/e2e-design.md section 6.5) - and
  # a fifth of the hour the whole suite took on windows-latest (docs/decisions.md, 2026-11-22).
  # perf measures on a runner nothing else is loading. A narrowed run is one part.
  e2e:
    name: e2e (${{ matrix.os }} ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.e2e_os || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        part: ${{ fromJSON(inputs.e2e_specs && '["chosen"]' || '["1", "2", "3", "4", "5", "perf"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # The narrowing comes in through the environment, never pasted into the command line.
      E2E_ARGS: ${{ inputs.e2e_specs || (matrix.part == 'perf' && '--project=perf --no-deps' || format('--project=e2e --shard={0}/5', matrix.part)) }}
      # How many tests each share takes, in run order: Playwright shares by count, file by file,
      # and the files' minutes per test differ by threefold, so equal counts left the longest
      # share half again as long as the shortest. These counts cut where the minutes of the last
      # windows-latest run are even (about 11 minutes each; docs/decisions.md, 2026-11-22). They
      # drift as tests are added - re-cut when one share runs long. Playwright reads this variable
      # without documenting it; without it the shares are equal counts again, nothing worse.
      PWTEST_SHARD_WEIGHTS: ${{ !inputs.e2e_specs && '122:129:162:114:88' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Minimising a window and taking it fullscreen belong to the window manager,
      # not to the app: a bare Xvfb has none, so the window stays where it is, is
      # never reported minimised, and the tests about a window nobody can see have
      # nothing to watch. openbox is the smallest one that answers.
      - name: A window manager for the headless session
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openbox
      - name: Run Electron e2e (headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bash -c 'openbox --sm-disable & sleep 2 && npm run test:e2e -- $E2E_ARGS'
      - name: Run Electron e2e
        if: runner.os != 'Linux'
        shell: bash
        run: npm run test:e2e -- $E2E_ARGS
      # Each part's results, for the report below to put together when something failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ matrix.os }}-${{ matrix.part }}
          path: blob-report/
          retention-days: 1

  # One HTML report per system from its parts' results, as the single job used to leave.
  e2e-report:
    name: e2e report (${{ matrix.os }})
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.e2e_os || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Only Playwright's own merge runs here: no Electron, no install scripts.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-${{ matrix.os }}-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  package:
    name: package (${{ matrix.os }} ${{ matrix.arch }})
    needs: [static, test]
    if: ${{ !inputs.e2e_specs }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build and package
        run: npm run package -- --${{ matrix.arch }} --publish never
      # The packaged app started once as a user gets it: a first start, a shell through the
      # unpacked node-pty, a preset drawn, the runAsNode fuse (scripts/packaged-smoke.mjs).
      - name: Smoke test the package (headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/packaged-smoke.mjs
        timeout-minutes: 10
      - name: Smoke test the package
        if: runner.os != 'Linux'
        run: node scripts/packaged-smoke.mjs
        timeout-minutes: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elecdex-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
