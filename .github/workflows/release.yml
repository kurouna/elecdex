name: Release

# Push a tag that matches package.json's version (e.g. v0.1.0) and every
# platform's installers are built and attached to a GitHub pre-release.
# Review it and, when it is ready, edit it into a full release by hand: the
# in-app update check ignores pre-releases.
#
# Only the last job can write to the repository (found in a security review): the
# checks and the builds run every dependency's code - its install scripts, the tests,
# the packager - with a token that only reads, and hand the installers over as
# artifacts. The publish job runs none of the repository's code: it makes the
# pre-release and uploads what the builds left.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: check version & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # No npm cache in a release: a tag run would restore what other branches saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run verify

  package:
    name: build (${{ matrix.os }} ${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          # node-pty ships prebuilt win32-arm64 and darwin-x64 binaries and nothing
          # is rebuilt (npmRebuild: false), so these cross-package on the same runners.
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Build the installers
        run: npm run package -- --${{ matrix.arch }} --publish never
      # The packaged app started once as a user gets it (scripts/packaged-smoke.mjs), where the
      # runner can run what it built: not the cross-built Windows arm64 and macOS x64.
      - name: Smoke test the package (headless)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/packaged-smoke.mjs
      - name: Smoke test the package
        if: runner.os != 'Linux' && !(runner.os == 'Windows' && matrix.arch == 'arm64') && !(runner.os == 'macOS' && matrix.arch == 'x64')
        run: node scripts/packaged-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elecdex-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          # Long enough to run the publish job again by hand after a fix (Actions > Re-run).
          retention-days: 7

  # All or nothing: a build that fails leaves no pre-release, rather than one missing a
  # platform that people might take for complete. Re-run the failed build, then this job.
  publish:
    name: create pre-release & upload
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: elecdex-*
          path: dist
          merge-multiple: true
      # The installers are unsigned, so the notes open with what to do when Windows or
      # macOS warns - the same steps as the README's "If a warning appears", kept short
      # here, in English and Japanese - and GitHub appends the generated changes below them.
      - name: Create pre-release and upload the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Installing: the builds are unsigned

          Windows and macOS warn before the first run because the installers are not code-signed. The warning means the publisher is unknown to them, not that anything was found in the file. Each file's SHA-256 is listed beside it below. Full steps: [README → If a warning appears](https://github.com/kurouna/elecdex#if-a-warning-appears).

          - **Windows**: if the browser holds the download back, choose *Keep* (Edge: *⋯ → Keep → Show more → Keep anyway*). SmartScreen then shows "Windows protected your PC": click **More info → Run anyway**. The installer is per-user and asks for no administrator rights.
          - **macOS 15+**: open the app once and click **Done**. Then go to **System Settings → Privacy & Security → Open Anyway**. On macOS 14 or earlier, right-click the app and choose **Open**. If macOS says the app "is damaged", run `xattr -dr com.apple.quarantine /Applications/elecdex.app`.
          - **Linux**: no warning. On Ubuntu 24.04+ prefer the **.deb**, which installs the AppArmor profile Electron's sandbox needs; the AppImage needs `chmod +x` and `libfuse2` (`libfuse2t64`). Never run it with `--no-sandbox`.

          macOS and Linux builds pass the end-to-end tests on GitHub's runners but have had no hands-on testing yet.

          ## インストール：ビルドは未署名です

          インストーラーにコード署名がないため、Windows と macOS は初回の起動前に警告を出します。警告は発行元が分からないという意味で、ファイルに何かが見つかったわけではありません。各ファイルの SHA-256 は下の一覧に表示されています。詳しい手順は [README → If a warning appears](https://github.com/kurouna/elecdex#if-a-warning-appears)（英語）にあります。

          - **Windows**：ブラウザーがダウンロードを止めたら「保存」を選びます（Edge は「⋯ → 保存 → 詳細表示 → 保持する」）。SmartScreen の「Windows によって PC が保護されました」が出たら「**詳細情報 → 実行**」を押します。インストールはユーザー単位で、管理者権限は求めません。
          - **macOS 15 以降**：アプリを一度開いて「**完了**」を押し、「**システム設定 → プライバシーとセキュリティ → このまま開く**」を押します。macOS 14 以前は、アプリを右クリックして「**開く**」を選びます。「壊れているため開けません」と出たら `xattr -dr com.apple.quarantine /Applications/elecdex.app` を実行します。
          - **Linux**：警告は出ません。Ubuntu 24.04 以降では **.deb** を使ってください（Electron のサンドボックスに必要な AppArmor のプロファイルも入ります）。AppImage は `chmod +x` と `libfuse2`（`libfuse2t64`）が必要です。`--no-sandbox` では起動しないでください。

          macOS 版と Linux 版は GitHub のランナーで e2e テストを通していますが、実機での確認はまだです。

          EOF
          gh release create "$TAG" --prerelease --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
