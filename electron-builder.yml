appId: dev.kurouna.elecdex
productName: elecdex
copyright: Copyright © 2026 kurouna

directories:
  output: release
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json
  # The GeoIP package ships the database three ways; only the combined file is read.
  - '!node_modules/@ip-location-db/geo-whois-asn-country-mmdb/geo-whois-asn-country-ipv4.mmdb'
  - '!node_modules/@ip-location-db/geo-whois-asn-country-mmdb/geo-whois-asn-country-ipv6.mmdb'

# win/mac/linux icons are all derived from build/icon.png, which scripts/gen-icon.mjs
# renders from build/icon.svg (the elec series icon with the "E" badge).
asar: true
# node-pty spawns helper executables (winpty-agent.exe, conpty/OpenConsole.exe)
# and loads DLLs next to its .node files. Nothing inside an asar archive can be
# executed, so the whole package has to live outside it.
asarUnpack:
  - node_modules/node-pty/**
  # Handed to shells as real file paths (bash --init-file, fish XDG_DATA_DIRS),
  # which a separate process cannot read from inside an asar archive.
  - resources/shell-integration/**
compression: normal
# node-pty 1.x is an N-API addon and ships ABI-stable prebuilt binaries for
# Windows and macOS, which Electron loads as-is. Rebuilding it here would call
# node-gyp and fail on any machine without Visual Studio / Xcode, for no gain.
# (On Linux, where node-pty ships no prebuild, npm install already compiles it
# once against N-API, and that binary is equally valid under Electron.)
npmRebuild: false
forceCodeSigning: false

publish:
  provider: github
  owner: kurouna
  repo: elecdex
  # Assets go to the draft the release workflow creates for the tag; a person publishes it.
  releaseType: draft

artifactName: elecdex-${os}-${arch}-${version}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  # Required so a sandboxed-renderer Electron app can spawn a pty.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: System;TerminalEmulator
  # The .deb control file needs a maintainer; without one electron-builder asks for
  # an author email in package.json, and none is published for this project.
  maintainer: kurouna (https://github.com/kurouna)
  desktop:
    entry:
      Terminal: 'false'
      Categories: System;TerminalEmulator;Utility
